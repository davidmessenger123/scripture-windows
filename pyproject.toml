[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scripture-windows"
dynamic = ["version"]
description = "A Bible verse of the day on a full-screen dark overlay for Windows; a desktop port of the Omarchy Scripture bar widget."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David John Messenger" }]
dependencies = [
    "PySide6==6.11.2",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.scripts]
scripture = "scripture.main:main"

[tool.setuptools.dynamic]
version = { file = ["src/scripture/VERSION"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scripture = ["qml/*.qml", "VERSION"]
