[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scripture-windows"
version = "0.1.0"
description = "A Bible verse of the day on a full-screen dark overlay for Windows; a desktop port of the Omarchy Scripture bar widget."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "David John Messenger" }]
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
scripture = "scripture.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scripture = ["qml/*.qml"]