name: Build macOS app

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate release ref and source version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="0.0.0"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              printf '%s\n' 'release tag must be vMAJOR.MINOR.PATCH' >&2
              exit 1
            fi
            version="${REF_NAME#v}"
            source_version="$(tr -d '[:space:]' < src/scripture/VERSION)"
            if [[ "$version" != "$source_version" ]]; then
              printf '%s\n' 'tag version does not match src/scripture/VERSION' >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            pyproject.toml

      - name: Install pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Run unit tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Headless smoke test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripture --smoke

      - name: Generate app icon
        run: python scripts/make_icns.py

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller --noconfirm --clean Scripture-macos.spec

      - name: Smoke test the frozen app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          app="dist/Scripture.app/Contents/MacOS/Scripture"
          log="$HOME/Library/Application Support/davidjm/Scripture/startup-error.log"
          rm -f "$log"
          "$app" --smoke >/tmp/scripture-smoke.out 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.5
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null || true
            cat /tmp/scripture-smoke.out
            exit 1
          fi
          wait "$pid"
          if [[ -f "$log" ]]; then cat "$log"; exit 1; fi

      - name: Boot check
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          app="dist/Scripture.app/Contents/MacOS/Scripture"
          log="$HOME/Library/Application Support/davidjm/Scripture/startup-error.log"
          rm -f "$log"
          "$app" >/tmp/scripture-boot.out 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/scripture-boot.out
            exit 1
          fi
          if [[ -f "$log" ]]; then cat "$log"; kill -9 "$pid" 2>/dev/null || true; exit 1; fi
          kill "$pid" 2>/dev/null || true

      - name: Codesign with Developer ID
        if: github.ref_type == 'tag'
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERT_BASE64:-}" || -z "${MACOS_CERT_PASSWORD:-}" ]]; then
            printf '%s\n' 'Developer ID signing secrets are required for a tag build' >&2
            exit 1
          fi
          app="dist/Scripture.app"
          keychain="scripture-signing"
          keychain_path="$RUNNER_TEMP/scripture-signing.keychain-db"
          identity="Developer ID Application"
          security create-keychain -p "$MACOS_CERT_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 300 "$keychain_path"
          if ! printf '%s' "$MACOS_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dev-id.p12"; then
            printf '%s\n' 'Developer ID certificate data is not valid base64' >&2
            exit 1
          fi
          security import "$RUNNER_TEMP/dev-id.p12" -P "$MACOS_CERT_PASSWORD" -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERT_PASSWORD" "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -F "Developer ID Application" >/dev/null; then
            printf '%s\n' 'no Developer ID Application signing identity was imported' >&2
            exit 1
          fi
          if ! security find-certificate -c "Developer ID Certification Authority" "$keychain_path" >/dev/null 2>&1; then
            curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
            security import "$RUNNER_TEMP/g2.cer" -k "$keychain_path"
          fi
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q '^Mach-O'; then
              /usr/bin/codesign --force --options runtime --timestamp --sign "$identity" "$file"
            fi
          done < <(find "$app/Contents" -type f -print0)
          /usr/bin/codesign --force --options runtime --timestamp --sign "$identity" "$app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature"
          grep -q "^Authority=Developer ID Application" <<<"$signature"

      - name: Notarize and staple
        if: github.ref_type == 'tag'
        shell: bash
        env:
          MACOS_NOTARIZE_APPLE_ID: ${{ secrets.MACOS_NOTARIZE_APPLE_ID }}
          MACOS_NOTARIZE_APPLE_PASSWORD: ${{ secrets.MACOS_NOTARIZE_APPLE_PASSWORD }}
          MACOS_NOTARIZE_TEAM_ID: ${{ secrets.MACOS_NOTARIZE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_NOTARIZE_APPLE_ID:-}" || -z "${MACOS_NOTARIZE_APPLE_PASSWORD:-}" || -z "${MACOS_NOTARIZE_TEAM_ID:-}" ]]; then
            printf '%s\n' 'notarization secrets are required for a tag build' >&2
            exit 1
          fi
          app="dist/Scripture.app"
          zip="$RUNNER_TEMP/Scripture.zip"
          ditto -c -k --keepParent "$app" "$zip"
          submission="$(xcrun notarytool submit "$zip" --apple-id "$MACOS_NOTARIZE_APPLE_ID" --password "$MACOS_NOTARIZE_APPLE_PASSWORD" --team-id "$MACOS_NOTARIZE_TEAM_ID" --wait 2>&1)"
          printf '%s\n' "$submission"
          if ! printf '%s\n' "$submission" | grep -q 'status: Accepted'; then
            identifier="$(printf '%s\n' "$submission" | sed -n 's/.*id: \([0-9a-f-]*\).*/\1/p' | head -n1)"
            if [[ -n "$identifier" ]]; then
              xcrun notarytool log "$identifier" --apple-id "$MACOS_NOTARIZE_APPLE_ID" --password "$MACOS_NOTARIZE_APPLE_PASSWORD" --team-id "$MACOS_NOTARIZE_TEAM_ID"
            fi
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

      - name: Verify signed and notarized tag artifact
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/Scripture.app"
          test -d "$app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature"
          grep -q "^Authority=Developer ID Application" <<<"$signature"
          xcrun stapler validate "$app"

      - name: Package DMG
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/dmg-staging"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R dist/Scripture.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Scripture $RELEASE_VERSION" -srcfolder "$staging" -ov -format UDZO -fs HFS+ "dist/Scripture-$RELEASE_VERSION-$RELEASE_ARCH.dmg"

      - name: Generate SHA-256 sidecar
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          file="dist/Scripture-$RELEASE_VERSION-$RELEASE_ARCH.dmg"
          name="$(basename "$file")"
          (cd "$(dirname "$file")" && shasum -a 256 "$name") > "$file.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scripture-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/Scripture-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
            dist/Scripture-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg.sha256
            dist/Scripture.app

  publish:
    needs: build
    if: github.ref_type == 'tag' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scripture-macos-arm64
          path: release/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scripture-macos-x64
          path: release/x64
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then exit 1; fi
          release_version="${RELEASE_TAG#v}"
          (cd release/arm64 && shasum -a 256 -c "Scripture-$release_version-arm64.dmg.sha256")
          (cd release/x64 && shasum -a 256 -c "Scripture-$release_version-x64.dmg.sha256")
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Scripture $RELEASE_TAG" --generate-notes || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" \
            "release/arm64/Scripture-$release_version-arm64.dmg" \
            "release/arm64/Scripture-$release_version-arm64.dmg.sha256" \
            "release/x64/Scripture-$release_version-x64.dmg" \
            "release/x64/Scripture-$release_version-x64.dmg.sha256" \
            --clobber
