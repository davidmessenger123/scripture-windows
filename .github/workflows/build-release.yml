name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Headless smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripture --smoke

      - name: Build portable onefile exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean Scripture.spec

      - name: Smoke test the frozen exe (not just source)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          function Dump-Log([string]$path) {
            Write-Host "===== startup-error.log ====="
            Write-Host (Get-Content -LiteralPath $path -Raw)
            Write-Host "===== end ====="
          }
          $p = Start-Process -FilePath dist\Scripture.exe -ArgumentList '--smoke' -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $log = Join-Path (Join-Path $env:APPDATA 'davidjm') 'scripture\startup-error.log'
            if (Test-Path $log) { Dump-Log $log }
            throw "frozen exe smoke test did not exit within 20s (windowed traceback dialog? crash?)"
          }
          $code = $p.ExitCode
          if ($code -ne 0) {
            $log = Join-Path (Join-Path $env:APPDATA 'davidjm') 'scripture\startup-error.log'
            if (Test-Path $log) { Dump-Log $log }
            throw "frozen exe smoke test failed with exit code $code"
          }

      - name: Boot check (update check path, 12 s)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SCRIPTURE_FORCE_UPDATE_CHECK: "1"
        run: |
          function Dump-Log([string]$path) {
            Write-Host "===== startup-error.log ====="
            Write-Host (Get-Content -LiteralPath $path -Raw)
            Write-Host "===== end ====="
          }
          $p = Start-Process -FilePath dist\Scripture.exe -PassThru
          Start-Sleep -Seconds 12
          $log = Join-Path (Join-Path $env:APPDATA 'davidjm') 'scripture\startup-error.log'
          if ($p.HasExited) {
            if (Test-Path $log) { Dump-Log $log }
            throw "Scripture.exe exited on its own after startup (exit code $($p.ExitCode))"
          }
          if (Test-Path $log) {
            $err = Get-Content $log -Raw
            if ($err -and (Get-Item $log).LastWriteTime -gt (Get-Date).AddSeconds(-15)) {
              Dump-Log $log
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw "startup-error.log was written during the boot check"
            }
          }
          Stop-Process -Id $p.Id

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = '0.1.0-ci'
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\scripture.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scripture-windows
          path: |
            dist\Scripture.exe
            dist\Scripture-Setup-*.exe

      - name: Publish GitHub Release (tag push only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\Scripture.exe" `
            "dist\Scripture-Setup-${{ steps.version.outputs.version }}.exe" `
            --title "Scripture $env:GITHUB_REF_NAME" `
            --generate-notes