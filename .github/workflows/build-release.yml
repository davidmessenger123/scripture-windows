name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Headless smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripture --smoke

      - name: Build portable onefile exe
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean Scripture.spec

      - name: Smoke test the frozen exe (not just source)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $out = & dist\Scripture.exe --smoke 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) {
            $log = Join-Path $env:LOCALAPPDATA 'davidjm\scripture\startup-error.log'
            if (Test-Path $log) { Get-Content $log | Write-Error }
            throw "frozen exe smoke test failed with exit code $code"
          }

      - name: Boot check (update check path, 12 s)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SCRIPTURE_FORCE_UPDATE_CHECK: "1"
        run: |
          $p = Start-Process -FilePath dist\Scripture.exe -PassThru -NoNewWindow
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA 'davidjm\scripture\startup-error.log'
            if (Test-Path $log) { Get-Content $log | Write-Error }
            throw "Scripture.exe exited on its own after startup (exit code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = '0.1.0-ci'
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\scripture.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scripture-windows
          path: |
            dist\Scripture.exe
            dist\Scripture-Setup-*.exe

      - name: Publish GitHub Release (tag push only)
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\Scripture.exe" `
            "dist\Scripture-Setup-${{ steps.version.outputs.version }}.exe" `
            --title "Scripture $env:GITHUB_REF_NAME" `
            --generate-notes